# إعداد نشر Render (Blueprint) — خدمة ويب Python تشغّل serve.py
# ملاحظة: render.yaml يُطبَّق فقط عند إنشاء الخدمة عبر New > Blueprint.
# إن كانت الخدمة منشأة يدوياً، اضبط أمر التشغيل يدوياً في اللوحة:
#   Start Command: python3 serve.py
services:
  - type: web
    name: althenayan-site
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 serve.py
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      # ═══ مفاتيح الاتصال — تُضبط في لوحة Render (Environment) لا في المستودع ═══
      # sync: false يعني: القيمة تُدخَل يدوياً في اللوحة ولا تُحفظ في render.yaml
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_MEASUREMENT_ID
        sync: false
      - key: FIREBASE_PANEL_EMAIL
        sync: false
      - key: FIREBASE_PANEL_PASSWORD
        sync: false
      # نطاق الموقع العام (اختياري — للروابط المطلقة og:image/canonical/sitemap)
      - key: SITE_URL
        sync: false
